<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#f4f5f3; --card:#ffffff; --text:#1c2320; --dim:#6b7570; --line:#dfe3df;
  --accent:#2f6f4e; --accent-soft:#e6f0ea;
  --hoch:#c0392b; --mittel:#c8891b; --niedrig:#5b7c92;
  --warn:#fdf0ed; --shadow:0 1px 3px rgba(0,0,0,.07),0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181a; --card:#1d2225; --text:#e8ecea; --dim:#98a5a0; --line:#2e3538;
    --accent:#63b98b; --accent-soft:#1f3229;
    --hoch:#e8776a; --mittel:#e0ab5c; --niedrig:#8db0c4;
    --warn:#31211f; --shadow:0 1px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#14181a; --card:#1d2225; --text:#e8ecea; --dim:#98a5a0; --line:#2e3538;
  --accent:#63b98b; --accent-soft:#1f3229;
  --hoch:#e8776a; --mittel:#e0ab5c; --niedrig:#8db0c4;
  --warn:#31211f; --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Calibri,"Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); font-size:17px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;padding-block:0 96px}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding-block:14px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
header h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px;flex:1}
header .badge{font-size:13px;color:var(--dim);font-weight:400}
.iconbtn{
  background:none;border:1px solid var(--line);color:var(--dim);
  width:36px;height:36px;border-radius:9px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.iconbtn:hover{color:var(--text);border-color:var(--dim)}

/* ---------- Erfassung ---------- */
.capture{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:14px;margin-top:14px;
}
.capture-row{display:flex;gap:9px;align-items:flex-start}
#eingabe{
  flex:1;min-height:52px;max-height:180px;resize:none;
  font-family:inherit;font-size:17px;line-height:1.4;color:var(--text);
  background:transparent;border:none;outline:none;padding:8px 2px;
}
#eingabe::placeholder{color:var(--dim)}
.mic{
  flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:none;
  background:var(--accent-soft);color:var(--accent);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;
}
.mic:active{transform:scale(.94)}
.mic.aktiv{background:var(--hoch);color:#fff;animation:puls 1.2s infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.55}}
.mic[disabled]{opacity:.35;cursor:default}
.add{
  flex:0 0 auto;width:52px;height:52px;border-radius:14px;border:none;
  background:var(--accent);color:#fff;font-size:24px;cursor:pointer;
}
.add:disabled{opacity:.3;cursor:default}

.details{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none}
.details.offen{display:block}
.feldzeile{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.feld{flex:1 1 150px;min-width:0}
.feld label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.feld input,.feld select,.feld textarea{
  width:100%;font-family:inherit;font-size:16px;color:var(--text);
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:none;
}
.feld input:focus,.feld select:focus,.feld textarea:focus{border-color:var(--accent)}
.feld textarea{min-height:64px;resize:vertical}
.mehr{
  background:none;border:none;color:var(--accent);font-family:inherit;font-size:14.5px;
  cursor:pointer;padding:6px 0 0;
}
.dringwahl{display:flex;gap:6px}
.dringwahl button{
  flex:1;font-family:inherit;font-size:15px;padding:9px 4px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--dim);
}
.dringwahl button.gewaehlt{border-color:currentColor;font-weight:600}
.dringwahl button[data-w="Hoch"].gewaehlt{color:var(--hoch);background:var(--warn)}
.dringwahl button[data-w="Mittel"].gewaehlt{color:var(--mittel)}
.dringwahl button[data-w="Niedrig"].gewaehlt{color:var(--niedrig)}

/* ---------- Terminauswahl ---------- */
.termin-knoepfe{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.termin-knoepfe button{
  font-family:inherit;font-size:14.5px;padding:8px 12px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--dim);white-space:nowrap;
}
.termin-knoepfe button.gewaehlt{
  border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;
}
.termin-knoepfe button.loeschen{border:none;background:none;color:var(--dim);font-size:17px;padding:8px 6px}
.termin-anzeige{
  font-size:14.5px;color:var(--accent);padding:8px 2px 0;
}
.kalender{
  margin-top:9px;border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--bg);
}
.kal-kopf{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.kal-kopf span{font-size:15px;font-weight:600}
.kal-kopf button{
  border:none;background:none;color:var(--dim);font-family:inherit;font-size:19px;
  cursor:pointer;padding:2px 11px;border-radius:7px;line-height:1;
}
.kal-kopf button:hover{background:var(--card);color:var(--text)}
.kal-raster{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.kal-raster .wt{font-size:11.5px;color:var(--dim);text-align:center;padding:3px 0;text-transform:uppercase}
.kal-raster button{
  border:none;background:none;font-family:inherit;font-size:14.5px;color:var(--text);
  aspect-ratio:1;border-radius:8px;cursor:pointer;padding:0;
}
.kal-raster button:hover{background:var(--card)}
.kal-raster button.heute{color:var(--accent);font-weight:700}
.kal-raster button.aktiv{background:var(--accent);color:#fff;font-weight:600}
.kal-raster button.leer{visibility:hidden;cursor:default}

/* ---------- Filter ---------- */
.filter{display:flex;gap:7px;margin:18px 0 10px;flex-wrap:wrap}
.filter button{
  font-family:inherit;font-size:14.5px;padding:6px 13px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--dim);
}
.filter button.aktiv{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- Liste ---------- */
.gruppe{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:20px 0 8px;font-weight:600}
.gruppe.faellig{color:var(--hoch)}
.karte{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow);
  display:flex;gap:11px;align-items:flex-start;
}
.karte.ueberfaellig{border-left:4px solid var(--hoch)}
.karte.erledigt{opacity:.5}
.check{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
  background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:15px;margin-top:1px;
}
.check:hover{border-color:var(--accent)}
.check.an{background:var(--accent);border-color:var(--accent);color:#fff}
.inhalt{flex:1;min-width:0}
.titel{font-size:16.5px;word-wrap:break-word}
.karte.erledigt .titel{text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:5px;font-size:13.5px;color:var(--dim);align-items:center}
.pill{padding:1px 8px;border-radius:99px;font-size:12.5px;border:1px solid currentColor}
.pill.Hoch{color:var(--hoch)} .pill.Mittel{color:var(--mittel)} .pill.Niedrig{color:var(--niedrig)}
.pill.pruef{color:var(--mittel);background:var(--warn);border-style:dashed}
.meta a{color:var(--accent);text-decoration:none}
.notiz{margin-top:6px;font-size:14.5px;color:var(--dim);white-space:pre-wrap;word-wrap:break-word}
.kartenbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 5px;font-family:inherit}
.kartenbtn:hover{color:var(--text)}
.leer{text-align:center;color:var(--dim);padding:48px 20px;font-size:15.5px}

/* ---------- Dialog ---------- */
dialog{
  border:none;border-radius:14px;padding:0;background:var(--card);color:var(--text);
  max-width:520px;width:calc(100% - 32px);box-shadow:0 10px 50px rgba(0,0,0,.3);
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-kopf{padding:16px 18px 0;font-size:17px;font-weight:600}
.dlg-inhalt{padding:14px 18px}
.dlg-fuss{padding:6px 18px 16px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.btn{
  font-family:inherit;font-size:15.5px;padding:9px 16px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--text);
}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gefahr{color:var(--hoch)}
.hinweis{font-size:14px;color:var(--dim);margin:10px 0 0;line-height:1.5}
.status{font-size:13.5px;color:var(--dim);padding:8px 11px;background:var(--bg);border-radius:9px;margin-bottom:12px}
code{font-family:Consolas,monospace;font-size:13.5px;background:var(--bg);padding:1px 5px;border-radius:4px}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120%);
  background:var(--text);color:var(--bg);padding:11px 20px;border-radius:99px;
  font-size:15px;z-index:60;transition:transform .25s;max-width:calc(100% - 32px);text-align:center;
}
#toast.zeig{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Aufgaben <span class="badge" id="zaehler"></span></h1>
  <button class="iconbtn" id="btnSync" title="Speicher / Google Drive">☁</button>
  <button class="iconbtn" id="btnMenu" title="Mehr">⋯</button>
</header>

<!-- Schnellerfassung -->
<div class="capture">
  <div class="capture-row">
    <textarea id="eingabe" rows="1" placeholder="Was ist zu tun?" autocomplete="off"></textarea>
    <button class="mic" id="btnMic" title="Diktieren" aria-label="Diktieren">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/>
        <path d="M5.5 10.5v.5a6.5 6.5 0 0 0 13 0v-.5"/>
        <line x1="12" y1="18" x2="12" y2="21.5"/>
      </svg>
    </button>
    <button class="add" id="btnAdd" title="Aufgabe anlegen" disabled>＋</button>
  </div>
  <button class="mehr" id="btnMehr">Mehr Felder ▾</button>
  <div class="details" id="details">
    <div class="feldzeile">
      <div class="feld" style="flex:1 1 100%">
        <label>Dringlichkeit</label>
        <div class="dringwahl" id="dringwahl">
          <button type="button" data-w="Hoch">Hoch</button>
          <button type="button" data-w="Mittel" class="gewaehlt">Mittel</button>
          <button type="button" data-w="Niedrig">Niedrig</button>
        </div>
      </div>
    </div>
    <div class="feldzeile">
      <div class="feld" style="flex:1 1 100%">
        <label>Zieldatum</label>
        <div class="termin" id="tErfassung"></div>
      </div>
    </div>
    <div class="feldzeile">
      <div class="feld" style="flex:1 1 100%"><label>Link</label><input type="url" id="fLink" placeholder="Mail, Dokument …" autocomplete="off"></div>
    </div>
    <div class="feldzeile">
      <div class="feld" style="flex:1 1 100%"><label>Notiz</label><textarea id="fNotiz" placeholder="Optional, wenn mehr dazu gehört"></textarea></div>
    </div>
  </div>
</div>

<!-- Filter -->
<div class="filter" id="filter">
  <button data-f="offen" class="aktiv">Offen</button>
  <button data-f="heute">Fällig</button>
  <button data-f="warten">Warten</button>
  <button data-f="erledigt">Erledigt</button>
  <button data-f="alle">Alle</button>
</div>

<div id="liste"></div>

</div>

<div id="toast"></div>

<!-- Dialog: Bearbeiten -->
<dialog id="dlgEdit">
  <div class="dlg-kopf">Aufgabe bearbeiten</div>
  <div class="dlg-inhalt">
    <div class="feldzeile"><div class="feld" style="flex:1 1 100%"><label>Aufgabe</label><input type="text" id="eTitel"></div></div>
    <div class="feldzeile">
      <div class="feld"><label>Dringlichkeit</label><select id="eDring"><option>Hoch</option><option>Mittel</option><option>Niedrig</option></select></div>
      <div class="feld"><label>Status</label><select id="eStatus"><option>Offen</option><option>Warten</option><option>Erledigt</option></select></div>
    </div>
    <div class="feldzeile">
      <div class="feld" style="flex:1 1 100%">
        <label>Zieldatum</label>
        <div class="termin" id="tEdit"></div>
      </div>
    </div>
    <div class="feldzeile">
      <div class="feld"><label>Startdatum</label><input type="date" id="eStart"></div>
    </div>
    <div class="feldzeile"><div class="feld" style="flex:1 1 100%"><label>Link</label><input type="url" id="eLink"></div></div>
    <div class="feldzeile"><div class="feld" style="flex:1 1 100%"><label>Notiz</label><textarea id="eNotiz"></textarea></div></div>
    <div class="feldzeile"><div class="feld" style="flex:1 1 100%"><label>Prüfstatus</label><select id="ePruef"><option>Sicher</option><option>Bitte prüfen</option></select></div></div>
  </div>
  <div class="dlg-fuss">
    <button class="btn gefahr" id="eLoeschen">Löschen</button>
    <button class="btn" id="eAbbruch">Abbrechen</button>
    <button class="btn prim" id="eSpeichern">Speichern</button>
  </div>
</dialog>

<!-- Dialog: Speicher -->
<dialog id="dlgSync">
  <div class="dlg-kopf">Speicher</div>
  <div class="dlg-inhalt">
    <div class="status" id="syncStatus"></div>
    <div class="feldzeile"><div class="feld" style="flex:1 1 100%">
      <label>Google OAuth Client-ID</label>
      <input type="text" id="sClientId" placeholder="…apps.googleusercontent.com" autocomplete="off">
    </div></div>
    <div class="feldzeile"><div class="feld" style="flex:1 1 100%">
      <label>Datei-ID in Google Drive</label>
      <input type="text" id="sFileId" placeholder="leer lassen = App legt Datei an" autocomplete="off">
    </div></div>
    <p class="hinweis">Solange keine Client-ID eingetragen ist, speichert die App nur auf diesem Gerät. Die Einrichtung der Google-Anmeldung ist in der Kurzdokumentation beschrieben.</p>
  </div>
  <div class="dlg-fuss">
    <button class="btn" id="sAbmelden">Abmelden</button>
    <button class="btn" id="sJetzt">Jetzt abgleichen</button>
    <button class="btn prim" id="sSpeichern">Speichern</button>
  </div>
</dialog>

<!-- Dialog: Menü -->
<dialog id="dlgMenu">
  <div class="dlg-kopf">Mehr</div>
  <div class="dlg-inhalt">
    <div class="status" id="menuStatus"></div>
    <div class="dlg-fuss" style="padding:0;justify-content:flex-start;flex-direction:column;align-items:stretch">
      <button class="btn" id="mExport">Datei exportieren (JSON)</button>
      <button class="btn" id="mImport">Datei einlesen (JSON)</button>
      <button class="btn" id="mKalender">Termine als Kalenderdatei (ICS)</button>
      <button class="btn" id="mTheme">Darstellung wechseln</button>
      <button class="btn gefahr" id="mLeeren">Erledigte entfernen</button>
    </div>
    <input type="file" id="dateiInput" accept=".json,application/json" hidden>
  </div>
  <div class="dlg-fuss"><button class="btn prim" id="mSchliessen">Schließen</button></div>
</dialog>

<script>
"use strict";

/* =========================================================================
   P09 ToDo — private Aufgabenliste
   Datenschema: siehe P09_Aufgaben.json / Kurzdokumentation
   ========================================================================= */

const SCHEMA = "P09_ToDo";
const SCHEMA_VERSION = "1.0";
const LS_DATEN = "p09_daten";
const LS_CONFIG = "p09_config";
const SCOPE = "https://www.googleapis.com/auth/drive";
const DATEINAME = "P09_Aufgaben.json";

/* ---------- Zustand ---------- */
let daten = leeresModell();
let config = { clientId:"", fileId:"", theme:"" };
let filter = "offen";
let editId = null;
let token = null;          // { access_token, exp }
let tokenClient = null;
let syncLaeuft = false;

function leeresModell(){
  return {
    schema: SCHEMA,
    schemaVersion: SCHEMA_VERSION,
    beschreibung: "Private Aufgabenliste P09. Wird von der ToDo-App und von Claude gelesen und geschrieben.",
    naechsteNummer: 1,
    wertelisten: {
      dringlichkeit:["Hoch","Mittel","Niedrig"],
      status:["Offen","Warten","Erledigt"],
      pruefstatus:["Sicher","Bitte pruefen"],
      quelle:["Manuell","Sprache","Mail"]
    },
    aufgaben: []
  };
}

/* ---------- Hilfen ---------- */
const $ = s => document.querySelector(s);
/* Datum immer in Ortszeit bilden — toISOString() waere UTC und
   wuerde in Oesterreich zwischen Mitternacht und 2 Uhr den Vortag liefern. */
const isoVon = d => d.getFullYear() + "-" +
  String(d.getMonth()+1).padStart(2,"0") + "-" +
  String(d.getDate()).padStart(2,"0");
const heute = () => isoVon(new Date());
const inTagen = n => { const d = new Date(); d.setDate(d.getDate()+n); return isoVon(d); };
const jetzt = () => new Date().toISOString();
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(text){
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("zeig");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("zeig"), 2600);
}

function sicherLesen(key){
  try { return localStorage.getItem(key); } catch(e){ return null; }
}
function sicherSchreiben(key,wert){
  try { localStorage.setItem(key,wert); return true; } catch(e){ return false; }
}

function datumText(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  const t = new Date(heute()+"T00:00:00");
  const tage = Math.round((d-t)/86400000);
  if(tage === 0) return "heute";
  if(tage === 1) return "morgen";
  if(tage === -1) return "gestern";
  if(tage < 0) return Math.abs(tage)+" Tage überfällig";
  if(tage <= 7) return "in "+tage+" Tagen";
  return d.toLocaleDateString("de-AT",{day:"2-digit",month:"2-digit",year:"2-digit"});
}
function istUeberfaellig(a){
  return a.status !== "Erledigt" && a.zieldatum && a.zieldatum < heute();
}
function istHeute(a){
  return a.status !== "Erledigt" && a.zieldatum && a.zieldatum === heute();
}

/* ---------- Laden / Speichern lokal ---------- */
function ladeLokal(){
  const roh = sicherLesen(LS_DATEN);
  if(roh){
    try{
      const obj = JSON.parse(roh);
      if(obj && Array.isArray(obj.aufgaben)) daten = { ...leeresModell(), ...obj };
    }catch(e){ /* defekte Daten ignorieren, leeres Modell behalten */ }
  }
  const c = sicherLesen(LS_CONFIG);
  if(c){ try{ config = { ...config, ...JSON.parse(c) }; }catch(e){} }
  if(config.theme) document.documentElement.setAttribute("data-theme", config.theme);
}
function speichereLokal(){
  sicherSchreiben(LS_DATEN, JSON.stringify(daten));
}
function speichereConfig(){
  sicherSchreiben(LS_CONFIG, JSON.stringify(config));
}

/* ---------- Aufgaben ---------- */
function neueId(){
  const n = daten.naechsteNummer || 1;
  daten.naechsteNummer = n + 1;
  return "P09-" + String(n).padStart(4,"0");
}

function anlegen({titel, dringlichkeit="Mittel", zieldatum="", link="", notiz="", quelle="Manuell"}){
  const a = {
    id: neueId(),
    aufgabe: titel.trim(),
    notiz: notiz.trim(),
    dringlichkeit,
    zieldatum: zieldatum || null,
    startdatum: heute(),
    link: link.trim(),
    status: "Offen",
    pruefstatus: "Sicher",
    quelle,
    erledigtAm: null,
    geloeschtAm: null,
    letzteAenderung: jetzt()
  };
  daten.aufgaben.unshift(a);
  speichereLokal();
  return a;
}

function aendere(id, felder){
  const a = daten.aufgaben.find(x => x.id === id);
  if(!a) return;
  Object.assign(a, felder, { letzteAenderung: jetzt() });
  speichereLokal();
}

function umschalten(id){
  const a = daten.aufgaben.find(x => x.id === id);
  if(!a) return;
  if(a.status === "Erledigt"){
    aendere(id, { status:"Offen", erledigtAm:null });
  } else {
    aendere(id, { status:"Erledigt", erledigtAm: heute() });
  }
  zeichne();
  autoSync();
}

/* ---------- Darstellung ---------- */
const RANG = { Hoch:0, Mittel:1, Niedrig:2 };

/* Geloeschte Aufgaben bleiben als Markierung in der Datei stehen, damit die
   Loeschung auch auf den anderen Geraeten ankommt. Ueberall im Programm wird
   deshalb mit aktive() statt mit daten.aufgaben gearbeitet. */
function aktive(){
  return daten.aufgaben.filter(x => !x.geloeschtAm);
}

function loeschen(id){
  aendere(id, { geloeschtAm: jetzt() });
}

function sichtbare(){
  const a = aktive();
  switch(filter){
    case "offen":    return a.filter(x => x.status === "Offen");
    case "heute":    return a.filter(x => istUeberfaellig(x) || istHeute(x));
    case "warten":   return a.filter(x => x.status === "Warten");
    case "erledigt": return a.filter(x => x.status === "Erledigt");
    default:         return a.slice();
  }
}

function sortiere(liste){
  return liste.slice().sort((x,y) => {
    if(x.status === "Erledigt" && y.status !== "Erledigt") return 1;
    if(y.status === "Erledigt" && x.status !== "Erledigt") return -1;
    if(x.status === "Erledigt" && y.status === "Erledigt")
      return String(y.erledigtAm||"").localeCompare(String(x.erledigtAm||""));
    const xz = x.zieldatum || "9999-12-31";
    const yz = y.zieldatum || "9999-12-31";
    if(xz !== yz) return xz.localeCompare(yz);
    const r = (RANG[x.dringlichkeit]??1) - (RANG[y.dringlichkeit]??1);
    if(r !== 0) return r;
    return String(y.startdatum||"").localeCompare(String(x.startdatum||""));
  });
}

function karte(a){
  const kl = ["karte"];
  if(a.status === "Erledigt") kl.push("erledigt");
  else if(istUeberfaellig(a)) kl.push("ueberfaellig");

  const meta = [];
  if(a.dringlichkeit && a.dringlichkeit !== "Mittel")
    meta.push(`<span class="pill ${esc(a.dringlichkeit)}">${esc(a.dringlichkeit)}</span>`);
  if(a.zieldatum)
    meta.push(`<span${istUeberfaellig(a)?' style="color:var(--hoch)"':''}>📅 ${esc(datumText(a.zieldatum))}</span>`);
  if(a.status === "Warten") meta.push(`<span>⏳ Warten</span>`);
  if(a.link) meta.push(`<a href="${esc(a.link)}" target="_blank" rel="noopener">🔗 Link</a>`);
  if(a.pruefstatus === "Bitte prüfen" || a.pruefstatus === "Bitte pruefen")
    meta.push(`<span class="pill pruef">bitte prüfen</span>`);
  if(a.quelle === "Mail") meta.push(`<span>✉ aus Mail</span>`);
  meta.push(`<button class="kartenbtn" data-edit="${esc(a.id)}" title="Bearbeiten">✎</button>`);

  return `<div class="${kl.join(" ")}">
    <button class="check ${a.status==="Erledigt"?"an":""}" data-check="${esc(a.id)}" aria-label="Erledigt">✓</button>
    <div class="inhalt">
      <div class="titel">${esc(a.aufgabe)}</div>
      <div class="meta">${meta.join("")}</div>
      ${a.notiz ? `<div class="notiz">${esc(a.notiz)}</div>` : ""}
    </div>
  </div>`;
}

function zeichne(){
  const liste = sortiere(sichtbare());
  const el = $("#liste");

  const offen = aktive().filter(x => x.status === "Offen").length;
  const faellig = aktive().filter(x => istUeberfaellig(x) || istHeute(x)).length;
  $("#zaehler").textContent = offen ? `${offen} offen${faellig ? ` · ${faellig} fällig` : ""}` : "";

  if(!liste.length){
    const texte = {
      offen:"Keine offenen Aufgaben. ",
      heute:"Heute ist nichts fällig.",
      warten:"Nichts auf Warten.",
      erledigt:"Noch nichts erledigt.",
      alle:"Die Liste ist leer. Sprich oder tippe oben hinein."
    };
    el.innerHTML = `<div class="leer">${texte[filter]||""}</div>`;
    return;
  }

  let html = "";
  if(filter === "offen" || filter === "alle"){
    const gruppen = [
      ["Überfällig", liste.filter(istUeberfaellig), true],
      ["Heute fällig", liste.filter(istHeute), true],
      ["Mit Termin", liste.filter(a => a.status!=="Erledigt" && a.zieldatum && a.zieldatum > heute()), false],
      ["Ohne Termin", liste.filter(a => a.status!=="Erledigt" && !a.zieldatum), false],
      ["Erledigt", liste.filter(a => a.status==="Erledigt"), false]
    ];
    for(const [name, eintraege, dringend] of gruppen){
      if(!eintraege.length) continue;
      html += `<div class="gruppe${dringend?" faellig":""}">${name} · ${eintraege.length}</div>`;
      html += eintraege.map(karte).join("");
    }
  } else {
    html = liste.map(karte).join("");
  }
  el.innerHTML = html;
}

/* ---------- Terminauswahl (wiederverwendbarer Baustein) ----------
   Ersetzt das native Datumsfeld: Schnellknoepfe plus eigener Monatskalender.
   Ein Tippen auf den Tag uebernimmt sofort — kein Bestaetigen noetig.     */
function terminwahl(container, aufAenderung){
  let wert = "";
  let kalenderOffen = false;
  let monat = new Date();   // erster sichtbarer Monat

  const WOCHENTAGE = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  const MONATE = ["Jänner","Februar","März","April","Mai","Juni",
                  "Juli","August","September","Oktober","November","Dezember"];

  function setze(neu, kalenderSchliessen){
    wert = neu || "";
    if(kalenderSchliessen) kalenderOffen = false;
    zeichne();
    if(aufAenderung) aufAenderung(wert);
  }

  function monatVerschieben(n){
    monat = new Date(monat.getFullYear(), monat.getMonth() + n, 1);
    zeichne();
  }

  function kalenderHtml(){
    const ersterTag = new Date(monat.getFullYear(), monat.getMonth(), 1);
    const anzahl = new Date(monat.getFullYear(), monat.getMonth() + 1, 0).getDate();
    // getDay(): 0 = Sonntag; wir beginnen bei Montag
    const versatz = (ersterTag.getDay() + 6) % 7;

    let zellen = WOCHENTAGE.map(t => `<div class="wt">${t}</div>`).join("");
    for(let i = 0; i < versatz; i++) zellen += `<button class="leer" disabled></button>`;
    for(let t = 1; t <= anzahl; t++){
      const iso = isoVon(new Date(monat.getFullYear(), monat.getMonth(), t));
      const kl = [];
      if(iso === heute()) kl.push("heute");
      if(iso === wert) kl.push("aktiv");
      zellen += `<button data-tag="${iso}" class="${kl.join(" ")}">${t}</button>`;
    }
    return `<div class="kalender">
      <div class="kal-kopf">
        <button data-monat="-1" aria-label="Voriger Monat">‹</button>
        <span>${MONATE[monat.getMonth()]} ${monat.getFullYear()}</span>
        <button data-monat="1" aria-label="Nächster Monat">›</button>
      </div>
      <div class="kal-raster">${zellen}</div>
    </div>`;
  }

  function zeichne(){
    const schnell = [
      ["Heute", inTagen(0)],
      ["Morgen", inTagen(1)],
      ["+1 Woche", inTagen(7)]
    ];
    let html = `<div class="termin-knoepfe">`;
    for(const [name, iso] of schnell){
      html += `<button type="button" data-setz="${iso}" class="${wert===iso?"gewaehlt":""}">${name}</button>`;
    }
    const eigenes = wert && !schnell.some(([,iso]) => iso === wert);
    html += `<button type="button" data-kalender="1" class="${eigenes?"gewaehlt":""}">Datum …</button>`;
    if(wert) html += `<button type="button" data-leeren="1" class="loeschen" title="Termin entfernen">✕</button>`;
    html += `</div>`;
    if(wert) html += `<div class="termin-anzeige">${datumLang(wert)}</div>`;
    if(kalenderOffen) html += kalenderHtml();
    container.innerHTML = html;
  }

  container.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if(!b || !container.contains(b)) return;
    e.preventDefault();
    if(b.dataset.setz !== undefined)      return setze(b.dataset.setz === wert ? "" : b.dataset.setz, true);
    if(b.dataset.tag !== undefined)       return setze(b.dataset.tag, true);
    if(b.dataset.leeren !== undefined)    return setze("", true);
    if(b.dataset.monat !== undefined)     return monatVerschieben(parseInt(b.dataset.monat, 10));
    if(b.dataset.kalender !== undefined){
      kalenderOffen = !kalenderOffen;
      if(kalenderOffen) monat = wert ? new Date(wert + "T00:00:00") : new Date();
      return zeichne();
    }
  });

  zeichne();

  return {
    wert: () => wert,
    setzen: (neu) => { wert = neu || ""; kalenderOffen = false; zeichne(); },
    zuruecksetzen: () => { wert = ""; kalenderOffen = false; monat = new Date(); zeichne(); }
  };
}

function datumLang(iso){
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("de-AT",{weekday:"long", day:"2-digit", month:"long", year:"numeric"})
    + " · " + datumText(iso);
}

/* ---------- Diktat ---------- */
let erkennung = null;
let diktatAktiv = false;

function diktatVerfuegbar(){
  return "webkitSpeechRecognition" in window || "SpeechRecognition" in window;
}

function diktatStart(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  erkennung = new SR();
  erkennung.lang = "de-AT";
  erkennung.continuous = true;
  erkennung.interimResults = true;

  const vorher = $("#eingabe").value;
  let fertig = "";

  erkennung.onresult = (ev) => {
    let vorlaeufig = "";
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const stueck = ev.results[i][0].transcript;
      if(ev.results[i].isFinal) fertig += stueck;
      else vorlaeufig += stueck;
    }
    $("#eingabe").value = (vorher ? vorher + " " : "") + fertig + vorlaeufig;
    eingabeGeaendert();
  };
  erkennung.onerror = (ev) => {
    diktatStop();
    if(ev.error === "not-allowed") toast("Mikrofon nicht freigegeben");
    else if(ev.error !== "aborted") toast("Diktat nicht möglich");
  };
  erkennung.onend = () => { if(diktatAktiv) diktatStop(); };

  try{
    erkennung.start();
    diktatAktiv = true;
    $("#btnMic").classList.add("aktiv");
  }catch(e){ toast("Diktat nicht möglich"); }
}

function diktatStop(){
  diktatAktiv = false;
  $("#btnMic").classList.remove("aktiv");
  try{ erkennung && erkennung.stop(); }catch(e){}
}

/* ---------- Google Drive ---------- */
function gisGeladen(){
  return window.google && window.google.accounts && window.google.accounts.oauth2;
}

function ladeGis(){
  return new Promise((ok, fehler) => {
    if(gisGeladen()) return ok();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = ok;
    s.onerror = () => fehler(new Error("Google-Anmeldung konnte nicht geladen werden"));
    document.head.appendChild(s);
  });
}

function tokenGueltig(){
  return token && token.access_token && Date.now() < token.exp - 60000;
}

async function holeToken(interaktiv){
  if(tokenGueltig()) return token.access_token;
  if(!config.clientId) throw new Error("Keine Client-ID hinterlegt");
  await ladeGis();
  return new Promise((ok, fehler) => {
    tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: config.clientId,
      scope: SCOPE,
      callback: (antwort) => {
        if(antwort.error) return fehler(new Error(antwort.error));
        token = { access_token: antwort.access_token, exp: Date.now() + (antwort.expires_in||3600)*1000 };
        ok(token.access_token);
      },
      error_callback: (e) => fehler(new Error(e && e.type ? e.type : "Anmeldung abgebrochen"))
    });
    tokenClient.requestAccessToken({ prompt: interaktiv ? "consent" : "" });
  });
}

async function driveLesen(){
  const t = await holeToken(false);
  if(!config.fileId) return null;
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${config.fileId}?alt=media`, {
    headers: { Authorization: "Bearer " + t }
  });
  if(r.status === 404) return null;
  if(!r.ok) throw new Error("Lesen fehlgeschlagen (" + r.status + ")");
  return await r.json();
}

async function driveSchreiben(inhalt){
  const t = await holeToken(false);
  const koerper = JSON.stringify(inhalt, null, 2);
  if(config.fileId){
    const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${config.fileId}?uploadType=media`, {
      method:"PATCH",
      headers:{ Authorization:"Bearer "+t, "Content-Type":"application/json" },
      body: koerper
    });
    if(!r.ok) throw new Error("Schreiben fehlgeschlagen (" + r.status + ")");
    return config.fileId;
  }
  // Datei existiert noch nicht: neu anlegen
  const grenze = "p09grenze" + Date.now();
  const meta = { name: DATEINAME, mimeType: "application/json" };
  const body =
    `--${grenze}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
    `--${grenze}\r\nContent-Type: application/json\r\n\r\n${koerper}\r\n--${grenze}--`;
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method:"POST",
    headers:{ Authorization:"Bearer "+t, "Content-Type":"multipart/related; boundary="+grenze },
    body
  });
  if(!r.ok) throw new Error("Anlegen fehlgeschlagen (" + r.status + ")");
  const neu = await r.json();
  config.fileId = neu.id;
  speichereConfig();
  return neu.id;
}

/* Zusammenführen: pro Aufgabe gewinnt die juengere Aenderung */
function zusammenfuehren(lokal, fern){
  if(!fern || !Array.isArray(fern.aufgaben)) return lokal;
  const karteMap = new Map();
  for(const a of fern.aufgaben) karteMap.set(a.id, a);
  for(const a of lokal.aufgaben){
    const b = karteMap.get(a.id);
    if(!b || String(a.letzteAenderung||"") >= String(b.letzteAenderung||"")) karteMap.set(a.id, a);
  }
  // Loeschmarkierungen nach 60 Tagen endgueltig entfernen, damit die Datei nicht waechst
  const grenze = new Date();
  grenze.setDate(grenze.getDate() - 60);
  const vereint = Array.from(karteMap.values())
    .filter(a => !a.geloeschtAm || new Date(a.geloeschtAm) > grenze);
  const hoechste = vereint.reduce((m,a) => {
    const treffer = /-(\d+)$/.exec(String(a.id));   // nur die Nummer hinter dem Bindestrich
    const n = treffer ? parseInt(treffer[1],10) : NaN;
    return isNaN(n) ? m : Math.max(m,n);
  }, 0);
  return {
    ...leeresModell(),
    naechsteNummer: Math.max(lokal.naechsteNummer||1, fern.naechsteNummer||1, hoechste+1),
    aufgaben: vereint
  };
}

async function synchronisiere(still){
  if(!config.clientId){ if(!still) toast("Keine Client-ID hinterlegt"); return; }
  if(syncLaeuft) return;
  syncLaeuft = true;
  try{
    const fern = await driveLesen();
    daten = zusammenfuehren(daten, fern);
    speichereLokal();
    await driveSchreiben(daten);
    zeichne();
    if(!still) toast("Mit Google Drive abgeglichen");
  }catch(e){
    if(!still) toast("Abgleich fehlgeschlagen: " + e.message);
  }finally{
    syncLaeuft = false;
    syncStatusZeigen();
  }
}

let syncTimer = null;
function autoSync(){
  if(!config.clientId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => synchronisiere(true), 2500);
}

function syncStatusZeigen(){
  const el = $("#syncStatus");
  if(!el) return;
  if(!config.clientId){
    el.textContent = "Nur auf diesem Gerät gespeichert. " + aktive().length + " Aufgaben.";
  } else if(tokenGueltig()){
    el.textContent = "Mit Google Drive verbunden" + (config.fileId ? " · Datei " + config.fileId.slice(0,10) + "…" : " · Datei wird beim ersten Abgleich angelegt");
  } else {
    el.textContent = "Client-ID hinterlegt, noch nicht angemeldet.";
  }
}

/* ---------- Export / Import / Kalender ---------- */
function herunterladen(name, inhalt, typ){
  const blob = new Blob([inhalt], { type: typ });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function icsBauen(){
  const zeilen = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//P09//ToDo//DE","CALSCALE:GREGORIAN"];
  const offen = aktive().filter(a => a.status !== "Erledigt" && a.zieldatum);
  for(const a of offen){
    const tag = a.zieldatum.replace(/-/g,"");
    const naechster = new Date(a.zieldatum+"T00:00:00");
    naechster.setDate(naechster.getDate()+1);
    const ende = isoVon(naechster).replace(/-/g,"");
    zeilen.push("BEGIN:VEVENT");
    zeilen.push("UID:" + a.id + "@p09");
    zeilen.push("DTSTAMP:" + jetzt().replace(/[-:]/g,"").slice(0,15) + "Z");
    zeilen.push("DTSTART;VALUE=DATE:" + tag);
    zeilen.push("DTEND;VALUE=DATE:" + ende);
    zeilen.push("SUMMARY:" + String(a.aufgabe).replace(/[\n,;]/g," "));
    if(a.notiz || a.link)
      zeilen.push("DESCRIPTION:" + String((a.notiz||"") + (a.link ? " " + a.link : "")).replace(/[\n,;]/g," "));
    zeilen.push("BEGIN:VALARM","TRIGGER:-PT9H","ACTION:DISPLAY","DESCRIPTION:Erinnerung","END:VALARM");
    zeilen.push("END:VEVENT");
  }
  zeilen.push("END:VCALENDAR");
  return { text: zeilen.join("\r\n"), anzahl: offen.length };
}

      startdatum: $("#eStart").value || heute(),
      link: $("#eLink").value.trim(),
      notiz: $("#eNotiz").value.trim(),
      pruefstatus: $("#ePruef").value,
      erledigtAm: status === "Erledigt" ? (alt && alt.erledigtAm ? alt.erledigtAm : heute()) : null
    });
    $("#dlgEdit").close();
    zeichne();
    toast("Gespeichert");
    autoSync();
  });
  $("#eLoeschen").addEventListener("click", () => {
    if(!editId) return;
    loeschen(editId);
    $("#dlgEdit").close();
    zeichne();
    toast("Gelöscht");
    autoSync();
  });

  /* Speicher */
  $("#btnSync").addEventListener("click", () => {
    $("#sClientId").value = config.clientId || "";
    $("#sFileId").value = config.fileId || "";
    syncStatusZeigen();
    $("#dlgSync").showModal();
  });
  $("#sSpeichern").addEventListener("click", () => {
    config.clientId = $("#sClientId").value.trim();
    config.fileId = $("#sFileId").value.trim();
    speichereConfig();
    token = null;
    syncStatusZeigen();
    $("#dlgSync").close();
    toast(config.clientId ? "Einstellungen gespeichert" : "Speichert nur auf diesem Gerät");
  });
  $("#sJetzt").addEventListener("click", async () => {
    config.clientId = $("#sClientId").value.trim();
    config.fileId = $("#sFileId").value.trim();
    speichereConfig();
    if(!config.clientId){ toast("Erst Client-ID eintragen"); return; }
    toast("Abgleich läuft …");
    try{ await holeToken(true); }catch(e){ toast("Anmeldung fehlgeschlagen"); return; }
    await synchronisiere(false);
    $("#sFileId").value = config.fileId || "";
  });
  $("#sAbmelden").addEventListener("click", () => {
    token = null;
    syncStatusZeigen();
    toast("Abgemeldet");
  });

  /* Menü */
  $("#btnMenu").addEventListener("click", () => {
    const a = aktive();
    const offen = a.filter(x => x.status === "Offen").length;
    const erl = a.filter(x => x.status === "Erledigt").length;
    $("#menuStatus").textContent = `${a.length} Aufgaben · ${offen} offen · ${erl} erledigt`;
    $("#dlgMenu").showModal();
  });
  $("#mSchliessen").addEventListener("click", () => $("#dlgMenu").close());
  $("#mExport").addEventListener("click", () => {
    herunterladen(DATEINAME, JSON.stringify(daten, null, 2), "application/json");
    toast("Datei exportiert");
  });
  $("#mImport").addEventListener("click", () => $("#dateiInput").click());
  $("#dateiInput").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const leser = new FileReader();
    leser.onload = () => {
      try{
        const obj = JSON.parse(leser.result);
        if(!obj || !Array.isArray(obj.aufgaben)) throw new Error("kein P09-Format");
        daten = zusammenfuehren(daten, obj);
        speichereLokal();
        zeichne();
        toast("Eingelesen und zusammengeführt");
      }catch(err){ toast("Datei nicht lesbar"); }
    };
    leser.readAsText(f);
    e.target.value = "";
  });
  $("#mKalender").addEventListener("click", () => {
    const { text, anzahl } = icsBauen();
    if(!anzahl){ toast("Keine Aufgaben mit Zieldatum"); return; }
    herunterladen("P09_Termine.ics", text, "text/calendar");
    toast(anzahl + " Termine exportiert");
  });
  $("#mTheme").addEventListener("click", () => {
    const jetztDunkel = document.documentElement.getAttribute("data-theme") === "dark"
      || (!document.documentElement.getAttribute("data-theme")
          && window.matchMedia("(prefers-color-scheme: dark)").matches);
    config.theme = jetztDunkel ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", config.theme);
    speichereConfig();
  });
  $("#mLeeren").addEventListener("click", () => {
    const erledigte = aktive().filter(a => a.status === "Erledigt");
    if(!erledigte.length){ toast("Nichts zu entfernen"); return; }
    const anzahl = erledigte.length;
    erledigte.forEach(a => loeschen(a.id));
    zeichne();
    toast(anzahl + " erledigte entfernt");
    autoSync();
  });

  /* beim Zurückkehren abgleichen */
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && config.clientId) synchronisiere(true);
  });
}

function dialogEdit(id){
  const a = daten.aufgaben.find(x => x.id === id);
  if(!a) return;
  editId = id;
  $("#eTitel").value = a.aufgabe || "";
  $("#eDring").value = a.dringlichkeit || "Mittel";
  $("#eStatus").value = a.status || "Offen";
  if(terminEdit) terminEdit.setzen(a.zieldatum || "");
  $("#eStart").value = a.startdatum || heute();
  $("#eLink").value = a.link || "";
  $("#eNotiz").value = a.notiz || "";
  $("#ePruef").value = (a.pruefstatus === "Bitte pruefen") ? "Bitte prüfen" : (a.pruefstatus || "Sicher");
  $("#dlgEdit").showModal();
}

/* ---------- Start ---------- */
ladeLokal();
terminErfassung = terminwahl($("#tErfassung"));
terminEdit = terminwahl($("#tEdit"));
bindeEreignisse();
zeichne();
eingabeGeaendert();
if(config.clientId) synchronisiere(true);
</script>
</body>
</html>
